<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> داشبورد ادمین</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- Fontawesome CDNJS 6.6.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body">
  <header></header>

  <main>
    <aside class="sidebar">
      <header>
        <a href="/">
          <img src="./images/logo.png" class="website-logo" alt="" />
        </a>
      </header>
      <main class="side-menu">
        <ul class="side-container">
          <li>
            <a href="#" class="navlink active">
              <span class="navicon"><i class="fa-solid fa-house"></i></span>
              <span class="title">داشبورد</span>
            </a>
          </li>
          <!-- Products -->
          <li>
            <a href="./courses.html" class="navlink">
              <span class="navicon"><i class="fa-solid fa-box"></i></span>
              <span class="title">دوره ها</span>
            </a>
          </li>

          <li>
            <a href="./users.html" class="navlink">
              <span class="navicon"><i class="fa-solid fa-users"></i></span>
              <span class="title">کاربران</span>
            </a>
          </li>
        </ul>
      </main>
      <footer></footer>
      <button class="toggle-sidebar">
        <!-- Arrow Right -->
        <i class="fa-solid fa-angle-left"></i>
      </button>
    </aside>

    <section class="content">
      <div class="breadcrumbs">
        <a href="./index.html" class="breadcrumb">داشبورد</a>
      </div>

      <section class="hero-cards">
        <article>
          <i class="ui-border emerald top"></i>
          <i class="ui-border emerald bottom"></i>
          <!-- Products icon -->
          <span class="hero-card-icon products-icon">
            <i class="fa-solid fa-box"></i>
          </span>
          <div>
            <p class="hero-card-title">دوره ها</p>
            <p class="hero-card-data products-count"></p>
          </div>
        </article>
        <article>
          <i class="ui-border indigo top"></i>
          <i class="ui-border indigo bottom"></i>
          <!-- Users icon -->
          <span class="hero-card-icon users-icon">
            <i class="fa-solid fa-users"></i>
          </span>
          <div>
            <p class="hero-card-title">کاربران</p>
            <p class="hero-card-data users-count"></p>
          </div>
        </article>
      </section>

      <section class="after-hero">
        <section class="latest-users">
          <i class="ui-border top indigo"></i>
          <div class="section-header">
            <p class="section-title">جدیدترین کاربران</p>
            <!-- Redirect to /users page -->
            <a href="./users.html" class="section-link">
              بیشتر
              <!-- Arrow(Chervon Left) -->
              <i class="fa-solid fa-chevron-left"></i>
            </a>
          </div>
          <div class="users">
            <!-- loaded from js -->
          </div>
        </section>

        <section class="table-component">
          <i class="ui-border emerald top"></i>
          <div class="section-header">
            <div>
              <p class="title-text">لیست جدیدترین دوره ها</p>
              <p class="products-count-text caption-text">
                <span class="products-count"></span>
              </p>
            </div>
            <a href="./courses.html" class="section-link">
              <span>
                دوره ها
                <i class="fa-solid fa-chevron-left"></i>
              </span>
            </a>
          </div>

          <div class="table-head-row">
            <p>عنوان دوره</p>
            <p>قیمت دوره</p>
            <p>تعداد دانشجو</p>
          </div>

          <div class="table-body latest-products">
            <!-- loaded from js -->
          </div>
        </section>
      </section>
    </section>
  </main>

  <footer></footer>

  <button class="theme-button">
    <!-- Moon icon -->
    <i class="fas fa-moon"></i>
    <!-- Sun icon -->
    <!-- <i class="fas fa-sun"></i> -->
  </button>

  <script type="module" src="./js/index.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/toggleMenue.js"></script>
  </body>

</html>
